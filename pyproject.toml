[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "koe-harness"
version = "0.1.0"
description = "声 — a plugin-based harness for bilingual (JA/EN) voice AI: ASR, diarization, and LLM orchestration under explicit latency/cost/quality budgets."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "jon-jc" }]
keywords = ["asr", "speech-recognition", "diarization", "llm", "japanese", "voice-ai", "evaluation"]
classifiers = [
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "typing-extensions>=4.11",
]

[project.optional-dependencies]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "websockets>=12.0", "python-multipart>=0.0.9"]
llm = ["anthropic>=0.39", "openai>=1.40"]
asr = ["faster-whisper>=1.0", "soundfile>=0.12", "numpy>=1.26"]
ja = ["fugashi>=1.3", "unidic-lite>=1.0.8"]
aws = ["boto3>=1.34", "aws-lambda-powertools>=2.40"]
cli = ["typer>=0.12", "rich>=13.7"]
# pywinpty is the ConPTY binding the interactive terminal needs. Windows-only
# and optional: without it the pty backend says so and the panel uses pipes.
desktop = [
    "pywebview>=5.0",
    "pywinpty>=2.0; sys_platform == 'win32'",
]
build = ["pyinstaller>=6.10", "pillow>=10.0"]
dev = [
  "pytest>=8.2", "pytest-asyncio>=0.23", "pytest-cov>=5.0",
  "ruff>=0.5", "mypy>=1.10", "hypothesis>=6.100",
  "httpx>=0.27",  # fastapi TestClient
]
# Everything CI needs, in one place. Type checking must see the same
# dependencies the code imports, or strict mode reports third-party
# decorators as untyped -- so this is not just 'dev plus extras'.
ci = ["koe-harness[dev,api,cli,ja]"]
all = ["koe-harness[api,llm,asr,ja,aws,cli,desktop]"]

[project.scripts]
koe = "koe.cli.main:app"

[project.gui-scripts]
# gui-scripts gets a pythonw launcher on Windows: no console window flashes
# up behind the app when it starts.
koe-desktop = "koe.desktop.app:main"

[project.urls]
Homepage = "https://github.com/jon-jc/koe-harness"
Repository = "https://github.com/jon-jc/koe-harness"

[tool.hatch.build.targets.wheel]
packages = ["src/koe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
markers = [
  "slow: marks tests as slow (deselect with '-m \"not slow\"')",
  "requires_keys: needs live provider credentials",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC", "BLE", "C4", "PTH"]
ignore = ["E501", "B008", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.11"
packages = ["koe"]
mypy_path = "src"
strict = true
warn_return_any = true
disallow_untyped_defs = true
ignore_missing_imports = true

