name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint & types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[ci]"
      - name: Ruff (lint)
        run: ruff check src tests
      - name: Ruff (format check)
        run: ruff format --check src tests
      - name: Mypy (strict, linux)
        run: mypy
      - name: Mypy (strict, windows)
        # The desktop package has Windows-only branches. mypy narrows on
        # sys.platform, so those are skipped on the runner's own platform and
        # would never be checked at all without a second pass.
        run: mypy --platform win32

  test:
    # Japanese tokenization is an optional dependency, so the suite runs both
    # with and without MeCab. Without this split, a normalization bug can
    # reproduce on a developer machine and not in CI (or the reverse) purely
    # because of which extras happened to be installed.
    name: tests (py${{ matrix.python-version }}, ${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        extras: ["dev,api,cli", "ci"]
        # `include` only attaches these labels to combinations it matches on
        # `extras`; it does not create new ones.
        include:
          - extras: "dev,api,cli"
            label: "no-mecab"
          - extras: "ci"
            label: "mecab"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[${{ matrix.extras }}]"
      - name: Report Japanese backend
        run: python -c "from koe.text import mecab_available; print('mecab_available:', mecab_available())"
      - name: Test
        # Live-provider tests are excluded: CI must be deterministic and free.
        run: pytest -m "not requires_keys" --cov=koe --cov-report=term-missing --cov-report=xml
      - name: Benchmark suite smoke test
        # Not a performance gate — CI runners are too noisy for that. This only
        # proves the suite still imports and runs, so it cannot rot silently.
        env:
          PYTHONIOENCODING: utf-8
        run: python -m benchmarks --only routing
      - name: Evaluation harness smoke test
        # The harness that guards quality has to be guarded too. A clean
        # backend must score 0, and a clearly degraded one must be caught as a
        # significant regression rather than waved through.
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python -m koe.cli.main evaluate --degradation 0.0 --system clean
          python -m koe.cli.main compare --baseline 0.0 --candidate 0.15
      - name: Upload coverage
        if: matrix.python-version == '3.12' && matrix.extras == 'ci'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  web:
    name: web client (typecheck & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Build
        run: npm run build
      - name: Fail if the committed bundle is stale
        # dist/app.js is committed so `koe serve` works without a Node
        # toolchain. That only holds if it matches the sources.
        run: git diff --exit-code -- dist/app.js dist/app.css || (echo "::error::web/dist is out of date; run npm run build and commit it" && exit 1)

  terraform:
    name: terraform (fmt & validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: deploy/terraform
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - name: Format
        run: terraform fmt -check -recursive
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  docker:
    name: docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/docker/Dockerfile
          push: false
          load: true
          tags: koe:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image must start and serve health without credentials
        run: |
          docker run -d --name koe -p 8000:8000 -e KOE_ENVIRONMENT=local koe:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:8000/health > /tmp/health.json; then
              echo "healthy after ${i}s"; cat /tmp/health.json; exit 0
            fi
            sleep 1
          done
          echo "::error::container never became healthy"
          docker logs koe
          exit 1
      - name: Stop
        if: always()
        run: docker rm -f koe || true

  desktop:
    name: desktop app (.exe)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install
        run: pip install -e ".[api,llm,ja,cli,desktop,build]"
      - name: Build web client
        working-directory: web
        run: npm ci --no-audit --no-fund
      - name: Build application
        # build.py verifies the artifact itself: it launches the frozen exe
        # headless and asserts it serves /health and transcribes a meeting.
        # A PyInstaller build that succeeds and then dies on launch is the
        # normal failure here, and only running it catches that.
        run: python packaging/build.py
      - name: Build installer
        run: |
          choco install innosetup --no-progress -y
          python packaging/build.py --skip-web --skip-verify --installer
      - name: Upload application
        # A build check, not a distribution channel — this is a zip, it expires,
        # and it needs a login to fetch. Releases are what users download; see
        # .github/workflows/release.yml.
        uses: actions/upload-artifact@v4
        with:
          name: koe-desktop-windows
          path: |
            dist/koe-setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
