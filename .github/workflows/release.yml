# Publish the desktop installer as a downloadable release asset.
#
# CI already builds the installer on every pull request, but it uploads it as a
# workflow *artifact* — which is a zip, expires after 14 days, and requires a
# GitHub login to download. That is a fine build check and a useless
# distribution channel: for anyone who is not signed in, the "installable .exe"
# effectively does not exist. This workflow is the distribution channel.
#
# Triggered by a `v*` tag, or manually against any ref for a dry run.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build the installer but do not publish a release"
        type: boolean
        default: true

permissions:
  contents: write # required to create the release

jobs:
  installer:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: pip install -e ".[api,llm,ja,cli,desktop,build]"

      - name: Install web dependencies
        working-directory: web
        run: npm ci --no-audit --no-fund

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build application and installer
        # build.py launches the frozen exe headless and asserts it serves
        # /health and transcribes a meeting before the installer is compiled.
        # A release that ships a binary which dies on launch is the failure
        # this is here to prevent.
        run: python packaging/build.py --installer

      - name: Verify the checksum matches the artifact
        shell: pwsh
        run: |
          $line = (Get-Content dist/SHA256SUMS.txt).Trim()
          $expected, $name = $line -split '\s+', 2
          $actual = (Get-FileHash "dist/$name" -Algorithm SHA256).Hash.ToLower()
          if ($actual -ne $expected) {
            throw "checksum mismatch: recorded $expected, file is $actual"
          }
          "$name  $actual"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: koe-installer
          path: |
            dist/koe-setup-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/koe-setup-*.exe
            dist/SHA256SUMS.txt
          generate_release_notes: true
          body: |
            ## Install

            Download `koe-setup-*.exe` below and run it. The install is
            per-user — no administrator rights, no UAC prompt.

            **Windows will warn you before it runs.** The installer is not
            code-signed, so SmartScreen shows *"Windows protected your PC"*
            and hides the Run button behind **More info → Run anyway**. That
            warning means "we have not seen this file before", not "this file
            is harmful" — an unsigned binary from a small project always gets
            it.

            Verify what you downloaded before you click through that, in
            PowerShell:

            ```powershell
            Get-FileHash .\koe-setup-*.exe -Algorithm SHA256
            ```

            and compare it with `SHA256SUMS.txt` below.

            ### Prefer not to click through a SmartScreen warning?

            There is no installer in this path at all:

            ```bash
            pip install "koe-harness[api,cli,ja,desktop] @ git+https://github.com/jon-jc/koe-harness"
            koe-desktop
            ```

            ### Requirements

            Windows 10 or 11, x64, and the Microsoft Edge WebView2 runtime —
            already present on Windows 11 and on updated Windows 10. The
            installer checks and tells you where to get it if it is missing.
