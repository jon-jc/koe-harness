<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="koe — bilingual Japanese/English voice AI harness: streaming ASR, speaker diarization, and verified 議事録 generation."
    />
    <title>koe 声 — bilingual voice AI</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>声</text></svg>"
    />
  </head>
  <body>
    <!--
      Laid out after Claude Code: sessions on the left, the conversation as the
      page, and a side panel for what the conversation is about.

      The agent is the application rather than one view among four, because
      everything else here is something you would ask it about. The transcript,
      the 議事録, the code and a terminal open beside it instead of replacing it.
    -->
    <div class="app" id="workbench">
      <!-- ------------------------------------------------------- sidebar -->
      <aside class="sidebar" id="sidebar" aria-label="sessions">
        <div class="sb-head">
          <div class="brand">
            <span class="brand-mark" aria-hidden="true">声</span>
            <span class="brand-name">koe</span>
          </div>
          <div class="grow"></div>
          <button class="icon-btn ghost sm" id="sidebar-close" type="button" aria-label="sidebar" title="Ctrl+B">
            <span data-icon="sidebar"></span>
          </button>
        </div>

        <button class="new-session" id="new-session" type="button" title="Ctrl+Shift+O">
          <span class="new-session-icon" data-icon="plus"></span>
          <span id="t-new-session">新しいセッション</span>
        </button>

        <!-- Recording is the one thing koe does that no chat does, so it sits
             beside "new session" rather than behind a panel. -->
        <button class="sb-item" id="nav-record" type="button" title="Space">
          <span class="sb-item-icon"><span class="rec-dot" aria-hidden="true"></span></span>
          <span id="nav-record-label">会議を録音</span>
        </button>

        <div class="sb-heading" id="t-sessions">セッション</div>
        <div class="session-list" id="session-list" role="list"></div>

        <div class="sb-foot">
          <div class="lang" role="radiogroup" aria-label="Language / 言語" id="ui-lang">
            <button class="lang-opt" type="button" role="radio" data-lang="ja"
                    aria-checked="false" lang="ja">日本語</button>
            <button class="lang-opt" type="button" role="radio" data-lang="en"
                    aria-checked="false" lang="en">EN</button>
          </div>
          <div class="grow"></div>
          <button class="icon-btn ghost" id="theme" type="button" aria-label="テーマ切替">
            <span data-icon="contrast"></span>
          </button>
          <button class="icon-btn ghost" id="help" type="button" aria-label="キーボードショートカット">
            <span data-icon="help"></span>
          </button>
          <button class="icon-btn ghost" id="settings" type="button" aria-label="設定">
            <span data-icon="settings"></span>
          </button>
        </div>
      </aside>

      <div class="splitter" id="split-sidebar" role="separator" aria-orientation="vertical"
           tabindex="0" aria-label="resize sidebar"></div>

      <!-- ---------------------------------------------------------- main -->
      <main class="main">
        <header class="main-head">
          <button class="icon-btn ghost sm" id="sidebar-open" type="button" hidden aria-label="sidebar" title="Ctrl+B">
            <span data-icon="sidebar"></span>
          </button>
          <h1 class="session-title" id="session-title">新しいセッション</h1>
          <div class="grow"></div>

          <button class="rec-pill" id="rec-pill" type="button" hidden>
            <span class="rec-dot live" aria-hidden="true"></span>
            <span id="rec-pill-text">録音中</span>
          </button>

          <nav class="head-actions" aria-label="panels">
            <button class="head-btn" type="button" data-panel="transcript">
              <span data-icon="waveform"></span><span class="label">文字起こし</span>
            </button>
            <button class="head-btn" type="button" data-panel="analysis">
              <span data-icon="minutes"></span><span class="label">議事録</span>
            </button>
            <button class="head-btn" type="button" data-panel="code">
              <span data-icon="code"></span><span class="label">コード</span>
            </button>
            <button class="head-btn" type="button" data-panel="terminal">
              <span data-icon="terminal"></span><span class="label">ターミナル</span>
            </button>
            <button class="head-btn" id="cmdk" type="button" title="Ctrl+K">
              <span data-icon="search"></span><kbd class="kbd">Ctrl K</kbd>
            </button>
          </nav>
        </header>

        <!-- One view per session, mounted by the session manager. -->
        <div class="sessions-host" id="sessions-host"></div>
      </main>

      <div class="splitter" id="split-panel" role="separator" aria-orientation="vertical"
           tabindex="0" aria-label="resize panel"></div>

      <!-- ---------------------------------------------------- side panel -->
      <aside class="side-panel" id="panel" hidden aria-label="panel">
        <header class="panel-head">
          <span class="panel-icon" id="panel-icon"></span>
          <span class="panel-title" id="panel-title">文字起こし</span>
          <div class="grow"></div>
          <button class="icon-btn ghost sm" id="panel-close" type="button" aria-label="閉じる" title="Ctrl+J">
            <span data-icon="x"></span>
          </button>
        </header>

        <!-- transcript -->
        <section class="pane" id="doc-transcript">
          <div class="pane-toolbar">
            <button class="rec-btn" id="toggle" type="button" aria-pressed="false">
              <span class="rec-dot" aria-hidden="true"></span>
              <span id="toggle-label">録音開始</span>
            </button>
            <button class="btn ghost sm" id="demo" type="button">
              <span id="demo-label">デモ再生</span>
            </button>
            <label class="sr-only" for="asr-lang" id="t-asr-lang">認識言語</label>
            <select class="select sm" id="asr-lang">
              <option value="ja" selected>日本語</option>
              <option value="en">English</option>
              <option value="unknown">自動判定</option>
            </select>
            <div class="grow"></div>
            <button class="icon-btn ghost sm" id="search-toggle" type="button"
                    aria-label="検索" aria-controls="search" aria-expanded="false">
              <span data-icon="search"></span>
            </button>
            <button class="icon-btn ghost sm" id="copy-transcript" type="button" aria-label="文字起こしをコピー">
              <span data-icon="copy"></span>
            </button>
          </div>

          <div class="pane-meters">
            <div class="meter-row">
              <span class="meter-label" id="t-level">入力レベル</span>
              <div class="level"><div class="level-fill" id="level-fill"></div></div>
            </div>
            <canvas class="strip" id="level-canvas" aria-hidden="true"></canvas>
            <div class="chips">
              <span class="chip" id="status-chip">待機中</span>
              <span class="chip" id="speech-chip">無音</span>
              <span class="chip mono" id="status-backend">—</span>
              <span class="note" id="stats"></span>
            </div>
            <div class="speaker-row">
              <span class="meter-label" id="t-speakers">話者</span>
              <canvas class="strip tall" id="timeline-canvas" aria-hidden="true"></canvas>
            </div>
          </div>

          <!-- Filtering rather than jump-to-next: in a meeting transcript the
               question is almost always "where was X discussed". -->
          <div class="search" id="search" hidden>
            <input id="search-input" type="search" autocomplete="off"
                   placeholder="文字起こしを検索" aria-label="文字起こしを検索" />
            <span class="count" id="search-count" aria-live="polite"></span>
            <button class="icon-btn sm" id="search-close" type="button" aria-label="閉じる">×</button>
          </div>

          <div class="pane-body" id="transcript"></div>
        </section>

        <!-- minutes / routing / metrics -->
        <section class="pane" id="doc-analysis" hidden>
          <div class="pane-toolbar">
            <div class="segmented" id="tabs" role="tablist">
              <button class="seg on" role="tab" data-tab="minutes" id="tab-minutes"
                      aria-selected="true">議事録</button>
              <button class="seg" role="tab" data-tab="routing" id="tab-routing"
                      aria-selected="false">ルーティング</button>
              <button class="seg" role="tab" data-tab="metrics" id="tab-metrics"
                      aria-selected="false">メトリクス</button>
            </div>
          </div>
          <div class="pane-body" id="side"></div>
        </section>

        <!-- code: tree above, file below -->
        <section class="pane code-pane" id="doc-code" hidden>
          <div class="code-tree-host" id="code-tree"></div>
          <div class="code-view-host" id="code-view"></div>
        </section>

        <!-- terminal -->
        <section class="pane" id="doc-terminal" hidden>
          <div class="pane-toolbar">
            <div class="segmented" role="radiogroup" id="term-mode">
              <button class="seg on" type="button" role="radio" data-mode="pty"
                      aria-checked="true" id="term-mode-pty">対話</button>
              <button class="seg" type="button" role="radio" data-mode="plain"
                      aria-checked="false" id="term-mode-plain">簡易</button>
            </div>
            <span class="note" id="term-mode-hint"></span>
          </div>
          <div class="pane-fill">
            <div class="term-body" id="term-pty"></div>
            <div class="term-body" id="term-plain" hidden></div>
          </div>
        </section>
      </aside>
    </div>

    <!-- Final utterances are announced; interim hypotheses are not, because a
         screen reader re-reading a churning line is unusable. -->
    <div class="sr-only" id="live-region" role="status" aria-live="polite"></div>

    <script type="module" src="/static/app.js"></script>
  </body>
</html>
