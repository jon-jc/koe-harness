<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="koe — bilingual Japanese/English voice AI harness: streaming ASR, speaker diarization, and verified 議事録 generation."
    />
    <title>koe 声 — bilingual voice AI</title>
    <link rel="stylesheet" href="/static/app.css" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='26' font-size='26'>声</text></svg>"
    />
  </head>
  <body>
    <div class="app">
      <!-- ------------------------------------------------------- header -->
      <header class="header">
        <div class="brand">
          <span class="kanji" aria-hidden="true">声</span>
          <span>koe</span>
          <span class="tag" id="t-tagline">日本語・英語 音声AIハーネス</span>
        </div>

        <div class="spacer"></div>

        <div class="meta">
          <span class="sr-only" id="t-ui-lang">表示言語</span>
          <select class="select" id="ui-lang" aria-labelledby="t-ui-lang">
            <option value="ja">日本語</option>
            <option value="en">English</option>
          </select>
          <button class="icon-btn" id="theme" type="button" aria-label="テーマ切替">◑</button>
          <button class="icon-btn" id="settings" type="button" aria-label="設定">⚙</button>
          <button class="icon-btn" id="help" type="button" aria-label="キーボードショートカット">?</button>
        </div>
      </header>

      <!-- ---------------------------------------------------- workspaces -->
      <div class="shell">
        <nav class="rail" id="rail" role="tablist" aria-label="workspace">
          <button class="rail-item on" type="button" role="tab" data-view="meeting"
                  aria-selected="true" id="rail-meeting">
            <span class="rail-icon" aria-hidden="true">声</span>
            <span class="rail-label">議事録</span>
          </button>
          <button class="rail-item" type="button" role="tab" data-view="chat"
                  aria-selected="false" id="rail-chat" tabindex="-1">
            <span class="rail-icon" aria-hidden="true">話</span>
            <span class="rail-label">チャット</span>
          </button>
          <button class="rail-item" type="button" role="tab" data-view="terminal"
                  aria-selected="false" id="rail-terminal" tabindex="-1">
            <span class="rail-icon" aria-hidden="true">⌘</span>
            <span class="rail-label">端末</span>
          </button>
          <button class="rail-item" type="button" role="tab" data-view="code"
                  aria-selected="false" id="rail-code" tabindex="-1">
            <span class="rail-icon" aria-hidden="true">{ }</span>
            <span class="rail-label">コード</span>
          </button>
        </nav>

        <div class="views">
        <!-- ---------------------------------------------------- meeting -->
        <div class="view" id="view-meeting">
      <div class="stage">
        <button class="btn" id="toggle" type="button" aria-pressed="false">
          <span class="dot" aria-hidden="true"></span>
          <span id="toggle-label">録音開始</span>
        </button>

        <button class="btn ghost" id="demo" type="button" title="">
          <span id="demo-label">デモ再生</span>
        </button>

        <label class="meta" style="gap: 6px">
          <span id="t-asr-lang">認識言語</span>
          <select class="select" id="asr-lang">
            <option value="ja" selected>日本語</option>
            <option value="en">English</option>
            <option value="unknown">自動判定</option>
          </select>
        </label>

        <div class="level" role="meter" aria-label="input level">
          <div class="level-fill" id="level-fill"></div>
        </div>

        <div class="meta">
          <span class="chip" id="status-chip">待機中</span>
          <span class="chip" id="speech-chip">無音</span>
          <span>backend <b id="backend">—</b></span>
        </div>

        <div class="spacer"></div>
        <div class="note" id="t-hint"><kbd>Space</kbd></div>
      </div>

      <!-- -------------------------------------------------------- panes -->
      <div class="panes">
        <!-- transcript -->
        <section class="pane" aria-labelledby="t-transcript">
          <div class="pane-head">
            <span class="pane-title" id="t-transcript">文字起こし</span>
            <div class="spacer" style="flex: 1"></div>
            <span class="note" id="stats"></span>
            <button
              class="icon-btn"
              id="search-toggle"
              type="button"
              aria-label="検索"
              aria-controls="search"
              aria-expanded="false"
            >
              ⌕
            </button>
            <button class="icon-btn" id="copy-transcript" type="button" aria-label="文字起こしをコピー">
              ⧉
            </button>
          </div>

          <!-- Filtering rather than jump-to-next: in a meeting transcript the
               question is almost always “where was X discussed”, and the
               non-matching lines are noise for that question. -->
          <div class="search" id="search" hidden>
            <input
              id="search-input"
              type="search"
              autocomplete="off"
              placeholder="文字起こしを検索"
              aria-label="文字起こしを検索"
            />
            <span class="count" id="search-count" aria-live="polite"></span>
            <button class="icon-btn" id="search-close" type="button" aria-label="閉じる">×</button>
          </div>

          <div class="strip-wrap">
            <canvas class="strip" id="level-canvas" aria-hidden="true"></canvas>
            <span class="strip-label" id="t-level">入力レベル</span>
          </div>
          <div class="strip-wrap">
            <canvas
              class="strip"
              id="timeline-canvas"
              style="height: 40px"
              aria-hidden="true"
            ></canvas>
            <span class="strip-label" id="t-speakers">話者</span>
          </div>

          <div class="pane-body" id="transcript"></div>
        </section>

        <!-- minutes / routing / metrics -->
        <section class="pane" aria-label="analysis">
          <div class="tabs" id="tabs" role="tablist">
            <button class="tab" role="tab" data-tab="minutes" id="tab-minutes" aria-selected="true">
              議事録
            </button>
            <button class="tab" role="tab" data-tab="routing" id="tab-routing" aria-selected="false">
              ルーティング
            </button>
            <button class="tab" role="tab" data-tab="metrics" id="tab-metrics" aria-selected="false">
              メトリクス
            </button>
          </div>
          <div class="pane-body" id="side"></div>
        </section>
      </div>
        </div>

        <!-- ------------------------------------------------------- chat -->
        <div class="view" id="view-chat" hidden></div>

        <!-- --------------------------------------------------- terminal -->
        <div class="view" id="view-terminal" hidden></div>

        <!-- ------------------------------------------------------- code -->
        <div class="view" id="view-code" hidden></div>
        </div>
      </div>
    </div>

    <!-- Final utterances are announced; interim hypotheses are not, because a
         screen reader re-reading a churning line is unusable. -->
    <div class="sr-only" id="live-region" role="status" aria-live="polite"></div>

    <script src="/static/app.js"></script>
  </body>
</html>
